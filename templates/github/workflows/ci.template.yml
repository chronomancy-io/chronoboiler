---
name: CI/CD Pipeline

'on':
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: "{{SETUP_ACTION}}"
        with:
          "{{SETUP_VERSION_KEY}}": "{{LANGUAGE_VERSION}}"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: "{{CACHE_PATH}}"
          key: >-
            ${{ runner.os }}-{{PROJECT_NAME}}-${{
            hashFiles('{{LOCK_FILE}}') }}
          restore-keys: |
            ${{ runner.os }}-{{PROJECT_NAME}}-

      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"

      - name: Run linter
        run: "{{LINT_COMMAND}}"

      - name: Check formatting
        run: "{{FORMAT_CHECK_COMMAND}}"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: "{{SETUP_ACTION}}"
        with:
          "{{SETUP_VERSION_KEY}}": "{{LANGUAGE_VERSION}}"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: "{{CACHE_PATH}}"
          key: >-
            ${{ runner.os }}-{{PROJECT_NAME}}-${{
            hashFiles('{{LOCK_FILE}}') }}
          restore-keys: |
            ${{ runner.os }}-{{PROJECT_NAME}}-

      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"

      - name: Run tests
        run: "{{TEST_COMMAND}}"

      - name: Generate coverage report
        run: "{{COVERAGE_COMMAND}}"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: "{{COVERAGE_FILE}}"
          flags: unittests
          name: "codecov-{{PROJECT_NAME}}"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: "{{SETUP_ACTION}}"
        with:
          "{{SETUP_VERSION_KEY}}": "{{LANGUAGE_VERSION}}"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: "{{CACHE_PATH}}"
          key: >-
            ${{ runner.os }}-{{PROJECT_NAME}}-${{
            hashFiles('{{LOCK_FILE}}') }}
          restore-keys: |
            ${{ runner.os }}-{{PROJECT_NAME}}-

      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"

      - name: Run benchmarks
        run: "{{BENCH_COMMAND}}"

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "{{BENCH_TOOL}}"
          output-file-path: "{{BENCH_OUTPUT_FILE}}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "105%"
          comment-on-alert: true
          fail-on-alert: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: "{{SETUP_ACTION}}"
        with:
          "{{SETUP_VERSION_KEY}}": "{{LANGUAGE_VERSION}}"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: "{{CACHE_PATH}}"
          key: >-
            ${{ runner.os }}-{{PROJECT_NAME}}-${{
            hashFiles('{{LOCK_FILE}}') }}
          restore-keys: |
            ${{ runner.os }}-{{PROJECT_NAME}}-

      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"

      - name: Build
        run: "{{BUILD_COMMAND}}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "{{PROJECT_NAME}}-build"
          path: "{{ARTIFACT_PATH}}"
          retention-days: 7

  verify-docs:
    name: Documentation Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required documentation
        run: |
          MISSING=0
          REQUIRED_FILES=(
            README.md
            ARCHITECTURE.md
            PERFORMANCE.md
            CONTRIBUTING.md
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              MISSING=$((MISSING + 1))
            else
              echo "::notice::Found: $file"
            fi
          done
          if [[ $MISSING -gt 0 ]]; then
            exit 1
          fi

      - name: Validate repo-config.yaml
        run: |
          if [[ ! -f "repo-config.yaml" ]]; then
            echo "::error::Missing repo-config.yaml"
            exit 1
          fi
          echo "::notice::repo-config.yaml present"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
      - verify-docs
    if: always()
    steps:
      - name: Check job statuses
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.verify-docs.result }}
        run: |
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [[ "${TEST_RESULT}" != "success" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi
          if [[ "${DOCS_RESULT}" != "success" ]]; then
            echo "::error::Documentation verification failed"
            exit 1
          fi
          echo "::notice::All checks passed"
